version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: ilson-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ilson-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data: